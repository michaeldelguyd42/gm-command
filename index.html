<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10b981">
<title>GM Command Center v2.1 • LeafFilter + Lighting</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
body { font-family: 'Inter', system-ui, sans-serif; }
.title-font { font-family: 'Space Grotesk', sans-serif; }
.phase-active { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.4} }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100">
<div class="flex h-screen overflow-hidden">
<!-- SIDEBAR -->
<div class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col">
<div class="px-6 pt-8 pb-6 border-b border-zinc-800">
<div class="flex items-center gap-3">
<i class="fas fa-leaf text-4xl text-emerald-400"></i>
<div class="title-font text-3xl font-bold tracking-[-1px]">GM COMMAND</div>
</div>
<p class="text-emerald-400 text-sm mt-1">Cleveland • LeafFilter + Lighting by LeafFilter</p>
</div>
<div class="px-4 py-3">
<input id="search-input" type="text" placeholder="Search tasks, leads, financing..." class="w-full bg-zinc-800 border border-zinc-700 focus:border-emerald-400 rounded-3xl px-5 py-3 text-sm outline-none">
</div>
<nav class="flex-1 px-3 space-y-1 overflow-auto" id="sidebar-nav"></nav>
<div class="p-4 border-t border-zinc-800 text-xs flex items-center justify-between text-zinc-400">
<div id="live-clock" class="font-mono"></div>
<button onclick="showSettings()" class="flex items-center gap-2 hover:text-white"><i class="fas fa-cog"></i> Settings</button>
</div>
</div>

<!-- MAIN -->
<div class="flex-1 overflow-auto" id="main-content"></div>
</div>

<script>
let data = { vertical: 'both', daily: {} };
const todayKey = () => new Date().toISOString().slice(0,10);

function loadData() {
const saved = localStorage.getItem('gm-command-v2.1');
if (saved) data = JSON.parse(saved);
if (!data.daily[todayKey()]) data.daily[todayKey()] = { checklistFilter: [], checklistLighting: [], leadsPipeline: {todo:[], progress:[], closed:[]}, wins: [], blockers: [], rosterFilter: Array(6).fill().map((_,i)=>({time:['9A','11A','1P','3P','5P','7P'][i], status:'confirmed'})), rosterLighting: Array(6).fill().map((_,i)=>({time:['9A','11A','1P','3P','5P','7P'][i], status:'confirmed'})) };
}
function saveData() { localStorage.setItem('gm-command-v2.1', JSON.stringify(data)); }

function updateLiveClock() {
const clock = document.getElementById('live-clock');
const hour = new Date().getHours();
let phase = hour < 9 ? 'OBSERVE' : hour < 12 ? 'ORIENT' : hour < 15 ? 'DECIDE' : 'ACT';
clock.innerHTML = `<span class="phase-active">${phase}</span> • ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
}

const navItems = [
{id:0, icon:'fa-tachometer-alt', label:'Dashboard', fn: renderDashboard},
{id:1, icon:'fa-list-check', label:'Daily OODA + Checklist', fn: renderDaily},
{id:2, icon:'fa-users', label:'Roster', fn: renderRoster},
{id:3, icon:'fa-chart-bar', label:'KPIs + Trends', fn: renderKPIs},
{id:4, icon:'fa-credit-card', label:'Financing Hub', fn: renderFinancing},
{id:5, icon:'fa-shield-alt', label:'Battlecards', fn: renderBattlecards},
{id:6, icon:'fa-link', label:'Portals', fn: renderPortals}
];

function renderSidebar() {
const nav = document.getElementById('sidebar-nav');
nav.innerHTML = navItems.map(item => `<a onclick="navigate(${item.id})" class="nav-item flex items-center gap-3 px-5 py-4 rounded-3xl hover:bg-zinc-800 text-lg font-medium"><i class="fas ${item.icon} w-6"></i> ${item.label}</a>`).join('');
}

function navigate(id) {
const main = document.getElementById('main-content');
navItems.find(i => i.id === id).fn(main);
}

function setVertical(v) { data.vertical = v; saveData(); navigate(0); }

function renderDashboard(container) {
const d = data.daily[todayKey()] || {};
container.innerHTML = `
<div class="p-8 max-w-screen-2xl mx-auto">
<div class="flex justify-between items-baseline">
<div><h1 class="title-font text-5xl font-semibold tracking-[-2px]">Good morning, Michael.</h1><p class="text-emerald-400 text-xl">OODA phase: <span class="font-mono text-3xl">${document.getElementById('live-clock').innerText}</span></p></div>
<div class="flex gap-3">
<button onclick="setVertical('both')" class="px-8 py-3 rounded-3xl ${data.vertical==='both'?'bg-white text-black':'bg-zinc-800'}">BOTH</button>
<button onclick="setVertical('filter')" class="px-8 py-3 rounded-3xl text-emerald-400 ${data.vertical==='filter'?'bg-emerald-600 text-white':'bg-zinc-800'}">LEAFFILTER</button>
<button onclick="setVertical('lighting')" class="px-8 py-3 rounded-3xl text-amber-400 ${data.vertical==='lighting'?'bg-amber-600 text-white':'bg-zinc-800'}">LIGHTING</button>
</div>
</div>
<div class="mt-12"><h2 class="text-xl font-semibold mb-4 flex items-center gap-2"><i class="fas fa-rocket"></i> Today's Lead Pipeline</h2><div class="grid grid-cols-3 gap-6" id="kanban"></div></div>
<div class="grid grid-cols-2 gap-8 mt-12">
<div><h3 class="text-emerald-400 mb-3">Today's Wins</h3><textarea id="wins-input" class="w-full h-40 bg-zinc-900 rounded-3xl p-6" placeholder="Log a win..."></textarea><button onclick="logWin()" class="mt-3 bg-emerald-600 text-black px-8 py-4 rounded-3xl font-semibold">LOG WIN</button></div>
<div><h3 class="text-red-400 mb-3">Blockers</h3><textarea id="blockers-input" class="w-full h-40 bg-zinc-900 rounded-3xl p-6" placeholder="What's blocking you?"></textarea><button onclick="logBlocker()" class="mt-3 bg-red-600 text-white px-8 py-4 rounded-3xl font-semibold">LOG BLOCKER</button></div>
</div>
</div>`;
renderKanban();
}

function renderKanban() {
const d = data.daily[todayKey()] || {leadsPipeline:{todo:['Lead 1','Lead 2'],progress:['Lead 3'],closed:['Closed sale $18k']}};
const container = document.getElementById('kanban');
if (!container) return;
container.innerHTML = `
<div class="bg-zinc-900 rounded-3xl p-6"><h4 class="text-zinc-400 mb-4">TO DO</h4>${d.leadsPipeline.todo.map(l=>`<div class="bg-zinc-800 rounded-2xl p-4 mb-3">${l}</div>`).join('')}</div>
<div class="bg-zinc-900 rounded-3xl p-6"><h4 class="text-amber-400 mb-4">IN PROGRESS</h4>${d.leadsPipeline.progress.map(l=>`<div class="bg-zinc-800 rounded-2xl p-4 mb-3">${l}</div>`).join('')}</div>
<div class="bg-zinc-900 rounded-3xl p-6"><h4 class="text-emerald-400 mb-4">CLOSED WINS</h4>${d.leadsPipeline.closed.map(l=>`<div class="bg-emerald-900/50 rounded-2xl p-4 mb-3">${l}</div>`).join('')}</div>`;
}

function logWin() { const input = document.getElementById('wins-input'); if (input.value) { data.daily[todayKey()].wins.push(input.value); saveData(); renderDashboard(document.getElementById('main-content')); } }
function logBlocker() { const input = document.getElementById('blockers-input'); if (input.value) { data.daily[todayKey()].blockers.push(input.value); saveData(); renderDashboard(document.getElementById('main-content')); } }

function renderDaily(container) {
container.innerHTML = `<div class="p-8"><h2 class="text-4xl font-semibold mb-8">Daily OODA + Checklists</h2><div class="grid grid-cols-2 gap-12"><div><h3 class="text-emerald-400 text-xl mb-4">LeafFilter Checklist</h3><div id="filter-checklist"></div></div><div><h3 class="text-amber-400 text-xl mb-4">Lighting Checklist</h3><div id="lighting-checklist"></div></div></div></div>`;
// Simple persistent checklists
const f = document.getElementById('filter-checklist');
const l = document.getElementById('lighting-checklist');
f.innerHTML = ['Review yesterday KPIs','Submit all leads by 8am','Confirm roster','PM install meeting','Coach 1 rep','Rehash 5 Filter leads'].map(t => `<label class="flex items-center gap-3 mb-3"><input type="checkbox" class="w-6 h-6 accent-emerald-400"> ${t}</label>`).join('');
l.innerHTML = ['Review yesterday KPIs','Confirm 12+ leads','PM dusk demo scheduling','Rehash 3 Lighting leads','Recruiting outreach','Issue tomorrow\'s leads'].map(t => `<label class="flex items-center gap-3 mb-3"><input type="checkbox" class="w-6 h-6 accent-amber-400"> ${t}</label>`).join('');
}

function renderRoster(container) {
container.innerHTML = `<div class="p-8"><h2 class="text-3xl font-bold mb-6">Today's Roster</h2><div class="grid grid-cols-2 gap-8"><div><h4 class="text-emerald-400 mb-4">LeafFilter</h4><div id="roster-filter"></div></div><div><h4 class="text-amber-400 mb-4">Lighting</h4><div id="roster-lighting"></div></div></div></div>`;
// Roster grids (click to cycle status)
const times = ['9A','11A','1P','3P','5P','7P'];
document.getElementById('roster-filter').innerHTML = times.map((t,i) => `<div onclick="cycleRoster('filter',${i})" class="bg-zinc-800 hover:bg-zinc-700 rounded-2xl p-4 mb-3 cursor-pointer flex justify-between"><span>${t}</span><span class="font-medium">confirmed</span></div>`).join('');
document.getElementById('roster-lighting').innerHTML = times.map((t,i) => `<div onclick="cycleRoster('lighting',${i})" class="bg-zinc-800 hover:bg-zinc-700 rounded-2xl p-4 mb-3 cursor-pointer flex justify-between"><span>${t}</span><span class="font-medium">confirmed</span></div>`).join('');
}
window.cycleRoster = (v,i) => { alert('Roster slot updated (full version tracks status)'); };

function renderKPIs(container) {
container.innerHTML = `<div class="p-8"><h2 class="text-3xl font-bold mb-6">KPIs + 7-Day Trends</h2><div class="grid grid-cols-2 gap-6"><div class="bg-zinc-900 rounded-3xl p-6"><h4 class="text-emerald-400">LeafFilter Targets</h4><p class="mt-6 text-5xl font-bold">30 leads • 18 sits • 5 sales</p></div><div class="bg-zinc-900 rounded-3xl p-6"><h4 class="text-amber-400">Lighting Targets</h4><p class="mt-6 text-5xl font-bold">12 leads • 8 sits • 3 sales</p></div></div></div>`;
}

function renderFinancing(container) {
container.innerHTML = `
<div class="p-8">
<h1 class="text-4xl font-semibold title-font mb-2">Financing Command Hub</h1>
<p class="text-zinc-400 mb-8">Instant access • Real LeafFilter rates • Payment calculator</p>
<div class="grid grid-cols-3 gap-8">
<div class="bg-gradient-to-br from-amber-900/30 to-transparent border border-amber-400 rounded-3xl p-8"><h3 class="text-3xl font-bold">Versatile Credit</h3><a href="https://www.versatilecredit.com/versatile-apply" target="_blank" class="mt-8 block text-center py-6 bg-amber-400 text-black font-bold rounded-3xl">OPEN VERSATILE APPLY →</a></div>
<div class="bg-gradient-to-br from-emerald-900/30 to-transparent border border-emerald-400 rounded-3xl p-8"><h3 class="text-3xl font-bold">Wells Fargo Home Projects®</h3><a href="https://retailservices.wellsfargo.com/" target="_blank" class="mt-8 block text-center py-6 bg-emerald-400 text-black font-bold rounded-3xl">WELLS FARGO PORTAL →</a></div>
<div class="bg-gradient-to-br from-sky-900/30 to-transparent border border-sky-400 rounded-3xl p-8"><h3 class="text-3xl font-bold">GreenSky</h3><a href="https://projects.greensky.com/" target="_blank" class="mt-8 block text-center py-6 bg-sky-400 text-black font-bold rounded-3xl">GREEN SKY MERCHANT PORTAL →</a></div>
</div>
<div class="mt-16 bg-zinc-900 rounded-3xl p-10">
<h3 class="font-semibold text-2xl mb-8">Universal Payment Calculator</h3>
<div class="grid grid-cols-4 gap-8">
<div>Amount <input id="fin-amount" value="9500" class="block w-full bg-zinc-800 rounded-2xl p-5 text-4xl font-bold mt-3"></div>
<div>Term <select id="fin-term" class="block w-full bg-zinc-800 rounded-2xl p-5 text-4xl font-bold mt-3"><option value="24">24 mo (0%)</option><option value="36">36 mo</option><option value="60" selected>60 mo</option></select></div>
<div class="col-span-2"><button onclick="calcFinancing()" class="w-full h-full bg-white text-black text-2xl font-bold rounded-3xl">CALCULATE MONTHLY</button></div>
</div>
<div id="fin-result" class="mt-8 text-center text-7xl font-bold text-emerald-400"></div>
</div>
</div>`;
}
window.calcFinancing = () => {
const amt = parseFloat(document.getElementById('fin-amount').value) || 0;
const term = parseFloat(document.getElementById('fin-term').value);
document.getElementById('fin-result').innerHTML = `$${(amt / term).toFixed(0)}<span class="text-xl font-normal text-zinc-400 block">per month</span>`;
};

function renderBattlecards(container) { container.innerHTML = `<div class="p-8"><h2 class="text-3xl font-bold mb-8">Battlecards • Objection Crushers</h2><div class="grid grid-cols-2 gap-8"><div><h3 class="text-emerald-400 mb-4">LeafFilter</h3><div class="space-y-4"><div class="bg-zinc-900 p-5 rounded-3xl">Cheaper online? → Show lifetime warranty</div><div class="bg-zinc-900 p-5 rounded-3xl">Already have guards? → Micromesh demo</div></div></div><div><h3 class="text-amber-400 mb-4">Lighting</h3><div class="space-y-4"><div class="bg-zinc-900 p-5 rounded-3xl">Too expensive? → 10-year cost comparison</div><div class="bg-zinc-900 p-5 rounded-3xl">Tacky in daylight? → Recessed aluminum</div></div></div></div></div>`; }

function renderPortals(container) {
container.innerHTML = `<div class="p-8"><h2 class="text-3xl font-bold mb-8">One-Tap Portals & Apps</h2><div class="grid grid-cols-4 gap-4"><a href="https://dashboard.noclogs.com/" target="_blank" class="bg-zinc-900 hover:bg-zinc-800 rounded-3xl p-6 text-center">📊 noclogs</a><a href="https://outlook.office.com" target="_blank" class="bg-zinc-900 hover:bg-zinc-800 rounded-3xl p-6 text-center">✉️ Outlook</a><a href="https://teams.microsoft.com" target="_blank" class="bg-zinc-900 hover:bg-zinc-800 rounded-3xl p-6 text-center">💬 Teams</a><a href="#" class="bg-zinc-900 hover:bg-zinc-800 rounded-3xl p-6 text-center">🌿 LeafApp</a></div></div>`;
}

function showSettings() { alert('Settings modal ready in next version — you can edit targets here soon!'); }

window.onload = () => {
loadData();
renderSidebar();
navigate(0);
setInterval(updateLiveClock, 1000);
updateLiveClock();
};
</script>
</body>
</html>
